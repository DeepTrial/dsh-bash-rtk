name: Bug Report
description: File a bug report
labels: [bug]
body:
  - type: textarea
    id: description
    attributes:
      label: Description
      description: A clear and concise description of the bug.
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Reproduction
      description: Steps to reproduce the behavior.
      placeholder: |
        1. Go to '...'
        2. Click on '...'
        3. See error
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
      description: What you expected to happen.
    validations:
      required: true
  - type: input
    id: node
    attributes:
      label: Node.js version
      placeholder: e.g. 22.19.0
  - type: input
    id: plugin
    attributes:
      label: dsh-bash-rtk version
      placeholder: e.g. 0.1.0
  - type: input
    id: rtk
    attributes:
      label: rtk version
      placeholder: e.g. 1.2.3
  - type: textarea
    id: context
    attributes:
      label: Additional context
      description: Add any other context about the problem here.
